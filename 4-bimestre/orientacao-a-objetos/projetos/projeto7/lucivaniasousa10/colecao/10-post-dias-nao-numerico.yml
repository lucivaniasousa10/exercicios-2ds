info:
  name: Recusar dias que nao sao numero
  type: http
  seq: 10
http:
  method: POST
  url: http://localhost:3000/alugueis
  body:
    type: json
    data: |-
      {
        "assinante": "Diego",
        "jogo": "Celeste",
        "dias": "muitos"
      }
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("responde 400 com o erro de tipo de dias", function() {
          expect(res.status).to.equal(400);
          expect(res.body.erro).to.equal("O campo dias deve ser um numero");
        });
