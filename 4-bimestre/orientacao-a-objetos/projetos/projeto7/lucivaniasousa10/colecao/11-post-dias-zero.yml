info:
  name: Recusar dias menor ou igual a zero
  type: http
  seq: 11
http:
  method: POST
  url: http://localhost:3000/alugueis
  body:
    type: json
    data: |-
      {
        "assinante": "Diego",
        "jogo": "Celeste",
        "dias": 0
      }
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("responde 400 com o erro de dias maior que zero", function() {
          expect(res.status).to.equal(400);
          expect(res.body.erro).to.equal("O campo dias deve ser maior que zero");
        });
